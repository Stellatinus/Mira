# Controlli automatici su ogni pull request e su ogni push a main.
#
# Cosa controlla:
#  - frontend: installa le dipendenze (npm ci) e compila (npm run build), che include il controllo
#    dei tipi di TypeScript e quindi anche le traduzioni mancanti; poi le prove della logica e i contrasti dei colori (WCAG AA);
#  - backend: compila il server .NET trattando gli avvisi come errori e ne esegue i test (xUnit, senza rete);
#  - desktop: compila su Windows il guscio desktop (.NET MAUI, src/Mira.Desktop) con gli avvisi come errori;
#  - aggiornamento: su Windows, con processi veri, aggiorna da una versione di prova alla successiva e prova il ripristino.
#
# Gli stessi comandi si lanciano in locale: vedi CONTRIBUTING.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Il token di questo workflow può solo leggere il repository.
permissions:
  contents: read

# Un nuovo push alla stessa PR annulla l'esecuzione precedente, ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa le dipendenze
        run: npm ci
        working-directory: web

      - name: Controlla i tipi e compila
        run: npm run build
        working-directory: web

      # Prove della logica del frontend (web/scripts/logic.test.mjs), in Node, senza dipendenze.
      - name: Prova la logica del frontend
        run: npm test
        working-directory: web

      # Rapporti di contrasto WCAG AA delle coppie di colori, nei due temi (web/scripts/check-contrast.mjs).
      - name: Controlla i contrasti
        run: npm run contrast
        working-directory: web

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS NON è incluso: è una scelta del progetto (novembre 2026), per ora si controllano
        # solo Linux e Windows. Per aggiungerlo basta inserire `macos-latest` in questo elenco.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compila (gli avvisi sono errori)
        run: dotnet build src/Mira.Server --configuration Release -warnaserror

      # Il programma di appoggio dell'aggiornamento dall'interno (#92).
      - name: Compila il programma di appoggio (gli avvisi sono errori)
        run: dotnet build src/Mira.Updater --configuration Release -warnaserror

      # Test del backend con un GitHub finto (tests/Mira.Server.Tests): niente rete, niente token.
      - name: Prova il backend
        run: dotnet test tests/Mira.Server.Tests --configuration Release

  # Il guscio desktop (#16): una finestra .NET MAUI che avvia il server dentro il proprio processo.
  # Solo Windows, per ora; Android si aggiungerà con un suo job.
  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Il guscio incorpora il frontend compilato (finisce in src/Mira.Server/wwwroot).
      - name: Compila il frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Installa solo i carichi di lavoro che servono al progetto (MAUI per Windows).
      - name: Carichi di lavoro MAUI
        run: dotnet workload restore src/Mira.Desktop/Mira.Desktop.csproj

      - name: Compila il guscio desktop (gli avvisi sono errori)
        run: dotnet build src/Mira.Desktop --configuration Release -warnaserror

  # L'aggiornamento dall'interno (#92), provato con processi veri su Windows: un Mira 0.0.1 si chiude, il programma di
  # appoggio mette al suo posto la 0.0.2, la riavvia e controlla /api/version; poi un secondo scenario in cui la nuova non
  # risponde e si ripristina la vecchia. Usa il server autonomo come «Mira» (vedi tests/update-e2e/prova-aggiornamento.ps1).
  update-e2e:
    name: Aggiornamento (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compila il frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prova l'aggiornamento e il ripristino
        shell: pwsh
        run: ./tests/update-e2e/prova-aggiornamento.ps1
