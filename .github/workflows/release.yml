# Pacchetti e release di Mira.
#
# Come si fa una release: si crea un tag nel formato vMAJOR.MINOR.PATCH (es. v1.0.0). Vedi docs/RELEASING.md.
#
# Cosa succede:
#  - push di un tag v*.*.*: si compila il frontend e il server per Windows, Linux e macOS (programma autonomo,
#    non serve installare .NET) e l'app desktop per Windows, si prova che partano e rispondano, si crea la release
#    su GitHub con i pacchetti,
#    le somme di controllo e le note generate dalle PR fuse;
#  - pull request che tocca questo file o il progetto: stessa compilazione e stessa prova, ma senza creare
#    nessuna release (serve a controllare che il workflow funzioni prima di fonderlo).
name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'src/Mira.Server/Mira.Server.csproj'
      - 'src/Mira.Desktop/**'
      - 'src/Mira.Desktop.Tray/**'

# Di base il token può solo leggere; il job che pubblica la release chiede il permesso di scrivere.
permissions:
  contents: read

jobs:
  build:
    name: Pacchetto (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # macOS (Apple Silicon) è incluso nei pacchetti; la CI di compilazione resta solo su Linux e Windows.
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Il tag «$GITHUB_REF_NAME» non è nel formato vMAJOR.MINOR.PATCH (es. v1.0.0)"
              exit 1
            fi
          else
            # Prova su una pull request: non è una release.
            VERSION="0.0.0-prova"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Mira-$VERSION-${{ matrix.rid }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compila il frontend (finisce in src/Mira.Server/wwwroot)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pubblica il programma autonomo
        shell: bash
        run: >
          dotnet publish src/Mira.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output "publish/${{ steps.version.outputs.name }}"

      - name: Istruzioni di avvio nel pacchetto
        shell: bash
        run: |
          cat > "publish/${{ steps.version.outputs.name }}/AVVIO.txt" <<'EOF'
          Mira - dashboard GitHub multi-account

          1. Avvia Mira.Server (su Linux e macOS: ./Mira.Server).
          2. Apri http://127.0.0.1:5080 nel browser.
          3. Dalle Impostazioni collega i tuoi account con un token (la pagina spiega come crearlo).

          Mira ascolta solo sul tuo computer. I token restano cifrati nella tua cartella di configurazione
          (Windows: %APPDATA%\Mira, Linux e macOS: ~/.config/Mira). Documentazione: https://github.com/Stellatinus/Mira
          EOF

      # Prova vera: il programma parte da una cartella diversa dalla sua, serve il frontend e dichiara la versione.
      - name: Prova che il pacchetto parta e risponda
        shell: bash
        run: |
          export MIRA_URLS=http://127.0.0.1:5099
          export MIRA_DATA_DIR="$RUNNER_TEMP/mira-dati"
          EXE="./publish/${{ steps.version.outputs.name }}/Mira.Server"
          [ "$RUNNER_OS" = "Windows" ] && EXE="$EXE.exe"
          "$EXE" &
          PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5099/api/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5099/api/version | tee versione.json
          echo
          grep -q '"version":"${{ steps.version.outputs.version }}"' versione.json
          curl -fsS http://127.0.0.1:5099/ | grep -q 'id="root"'
          kill "$PID" || true

      - name: Archivio (Linux e macOS)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "${{ steps.version.outputs.name }}.tar.gz" -C publish "${{ steps.version.outputs.name }}"

      - name: Archivio (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ steps.version.outputs.name }}" -DestinationPath "${{ steps.version.outputs.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pacchetto-${{ matrix.rid }}
          path: ${{ steps.version.outputs.name }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  # L'app desktop per Windows (#16): finestra .NET MAUI con il server dentro. Pacchetto a parte, accanto a quello del server;
  # finisce nella stessa cartella `pacchetti` del job `release`, quindi ha somme di controllo e firma Sigstore come gli altri.
  build-desktop:
    name: Pacchetto desktop (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Il tag «$GITHUB_REF_NAME» non è nel formato vMAJOR.MINOR.PATCH (es. v1.0.0)"
              exit 1
            fi
          else
            VERSION="0.0.0-prova"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Mira-Desktop-$VERSION-win-x64" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compila il frontend (finisce in src/Mira.Server/wwwroot)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Carichi di lavoro MAUI
        run: dotnet workload restore src/Mira.Desktop/Mira.Desktop.csproj

      - name: Pubblica l'app desktop autonoma
        shell: bash
        run: >
          dotnet publish src/Mira.Desktop
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output "publish/${{ steps.version.outputs.name }}"

      # Dentro l'app il server è una libreria: il suo eseguibile (non autonomo) non serve e confonderebbe.
      - name: Togli l'eseguibile del server dal pacchetto
        shell: bash
        run: rm -f "publish/${{ steps.version.outputs.name }}/Mira.Server.exe" "publish/${{ steps.version.outputs.name }}/Mira.Server.runtimeconfig.json"

      - name: Istruzioni di avvio nel pacchetto
        shell: bash
        run: |
          cat > "publish/${{ steps.version.outputs.name }}/AVVIO.txt" <<'EOF'
          Mira Desktop - dashboard GitHub multi-account, come app per Windows

          1. Avvia Mira.exe: si apre la finestra di Mira e compare l'icona nella tray.
          2. La X della finestra la manda nella tray; per uscire usa «Esci» dal menu dell'icona.
          3. Dalle Impostazioni collega i tuoi account con un token e, se vuoi, attiva «Avvia Mira all'accesso».

          Il server di Mira gira dentro l'app e ascolta solo sul tuo computer (127.0.0.1, porta 5080 o quella di
          MIRA_URLS / config.json). I dati restano in %APPDATA%\Mira. Documentazione: https://github.com/Stellatinus/Mira
          EOF

      # Prova vera: l'app parte da una cartella diversa dalla sua, il server interno risponde con la versione giusta
      # e serve il frontend.
      - name: Prova che l'app parta e risponda
        shell: bash
        run: |
          export MIRA_URLS=http://127.0.0.1:5099
          export MIRA_DATA_DIR="$RUNNER_TEMP/mira-dati"
          "./publish/${{ steps.version.outputs.name }}/Mira.exe" &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5099/api/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5099/api/version | tee versione.json
          echo
          grep -q '"version":"${{ steps.version.outputs.version }}"' versione.json
          curl -fsS http://127.0.0.1:5099/api/desktop | grep -q '"available":true'
          curl -fsS http://127.0.0.1:5099/ | grep -q 'id="root"'
          taskkill //F //IM Mira.exe || true

      - name: Archivio
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ steps.version.outputs.name }}" -DestinationPath "${{ steps.version.outputs.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pacchetto-desktop-win-x64
          path: ${{ steps.version.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Pubblica la release
    needs: [build, build-desktop]
    # Solo per i tag: sulle pull request si prova la compilazione e basta.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Serve a Sigstore per firmare «senza chiave» con l'identità di questo workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true

      - name: Somme di controllo
        working-directory: pacchetti
        run: sha256sum * > SHA256SUMS.txt

      # Firma «keyless» (Sigstore): nessuna chiave da custodire; la firma lega il file all'identità di questo
      # workflow su questo repository e al tag. Ogni file ha il suo bundle `.sigstore.json` (firma, certificato e
      # prova nel registro pubblico). Si firma anche SHA256SUMS.txt.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Firma i pacchetti e le somme di controllo
        working-directory: pacchetti
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # Prova subito che le firme si verifichino come le verificherà l'utente: se fallisce, non si pubblica nulla.
      - name: Verifica le firme appena create
        working-directory: pacchetti
        run: |
          for f in $(ls | grep -v '\.sigstore\.json$'); do
            cosign verify-blob "$f" \
              --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FLAGS=()
          # Un tag con il trattino (es. v1.1.0-rc.1) è una versione di prova.
          [[ "$TAG" == *-* ]] && FLAGS+=(--prerelease)

          cat > note.md <<'EOF'
          ## Come si usa
          Scarica il pacchetto per il tuo sistema, estrailo e avvia `Mira.Server`; poi apri <http://127.0.0.1:5080>. Non serve installare .NET. Dettagli in `AVVIO.txt` dentro il pacchetto.

          I pacchetti sono **firmati con Sigstore** (identità di questo workflow, nessuna chiave da custodire): accanto a ogni file c'è il suo `.sigstore.json`. Come verificare: <https://github.com/Stellatinus/Mira/blob/main/docs/RELEASING.md#verificare-un-pacchetto>. La somma in `SHA256SUMS.txt` protegge da un download corrotto; la firma da un file che non esce da questo workflow.

          Per Windows c'è anche **Mira Desktop** (`Mira-Desktop-…-win-x64.zip`): la stessa dashboard in una finestra dedicata, con icona nella tray e avvio all'accesso opzionale; estrai e avvia `Mira.exe`.

          Il programma **non è firmato come eseguibile** (nessun certificato di firma del codice): Windows può mostrare un avviso di SmartScreen la prima volta e macOS blocca il primo avvio.

          Su macOS (Apple Silicon) il programma non è firmato né notarizzato: al primo avvio il sistema lo blocca. Per aprirlo, dal terminale: `xattr -d com.apple.quarantine Mira.Server` (e `chmod +x Mira.Server` se serve), poi `./Mira.Server`.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # La release esiste già (creata a mano dal sito insieme al tag): si allegano i pacchetti.
            gh release upload "$TAG" pacchetti/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" pacchetti/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mira ${TAG#v}" \
              --notes-file note.md \
              --generate-notes \
              "${FLAGS[@]}"
          fi
